<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Scores | Ruben Camacho</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="br logo" href="index.html" aria-label="rbncreates home"><span>rbncreates</span></a>
  <button class="br" id="open" type="button" aria-expanded="false" aria-controls="menu"><span>Menu</span></button>
</header>

<nav id="menu" hidden aria-label="Main">
  <button class="br close" id="close" type="button"><span>Close</span></button>
  <a class="big" href="index.html" style="--img:url(menu1.jpg)"><span>Home</span></a>
  <a class="big" href="scores.html" style="--img:url(menu2.jpg)"><span>Scores</span></a>
  <a class="big" href="content.html" style="--img:url(menu3.jpg)"><span>Content</span></a>
  <a class="big" href="about.html" style="--img:url(menu4.jpg)"><span>About</span></a>
  <a class="big" href="contact.html" style="--img:url(menu5.jpg)"><span>Contact</span></a>
</nav>
<main id="top" class="st-page sl">
  <div class="scorebg" id="scorebg" aria-hidden="true"></div>
  <div class="scorebg" id="scorebg2" aria-hidden="true"></div>
  <div class="topvid" aria-hidden="true"><video src="bg.mp4" poster="poster.jpg" autoplay muted loop playsinline preload="auto"></video></div>
  <section class="st" id="catalogue" aria-label="Scores">
    <h1 class="st-tabs" role="tablist" aria-label="Browse by type">
      <button type="button" role="tab" class="st-tab on" id="stab-film" aria-selected="true" aria-controls="view-film" data-v="film">Film</button>
      <button type="button" role="tab" class="st-tab" id="stab-scores" aria-selected="false" aria-controls="view-scores" data-v="scores">Scores</button>
    </h1>
    <div class="st-intros" aria-live="polite">
      <p class="on" data-v="film">Pick a project, then watch, read the story or listen.</p>
      <p data-v="scores">Standalone tracks from my catalogue. Press play and let it run.</p>
    </div>

    <div id="view-film" class="sl-film" role="tabpanel" aria-labelledby="stab-film">
      <div class="sl-slide" id="cdetail">
        <div class="sl-copy">
          <p class="label" id="ckind"></p>
          <h2 id="ctitle"></h2>
          <p class="cd-meta" id="cmeta"></p>
          <p class="sl-text" id="ctext"></p>
          <div class="sl-actions" id="sseg">
            <button type="button" class="sl-btn primary" data-p="watch">Watch film</button>
            <button type="button" class="sl-btn" data-p="story">Read the story</button>
            <button type="button" class="sl-btn" data-p="listen">Listen</button>
          </div>
        </div>
        <figure class="sl-poster" id="spost"><img id="spimg" src="" alt="" draggable="false"></figure>
      </div>
      <div class="sl-fob" id="sfob">
        <span class="sl-cord" id="scord" aria-hidden="true"></span>
        <button type="button" class="sl-pull" id="spull" aria-label="Next project: pull, swipe or press"><i aria-hidden="true"></i></button>
        <span class="sl-fobcount" id="ccount" aria-hidden="true">01 / 04</span>
      </div>
    </div>

    <div id="view-scores" class="sc-view" role="tabpanel" aria-labelledby="stab-scores" hidden>
      <div class="cd-player sc-player">
        <div class="pl">
          <button class="pbtn" id="splay" type="button" aria-label="Play"><i class="pico" aria-hidden="true"></i></button>
          <input id="sseek" type="range" min="0" max="1000" value="0" aria-label="Seek" disabled>
          <span class="pl-time" id="stime">0:00</span>
        </div>
        <ol class="tracks" id="stracks"></ol>
      </div>
    </div>
  </section>
</main>
  <div class="sl-sheet" id="ssheet" role="dialog" aria-modal="true" aria-label="Project details" hidden>
    <button type="button" class="br sl-close" id="sclose"><span>Close</span></button>
    <div class="sl-sheet-in">
      <p class="label sl-head" id="sshead"></p>
      <div class="sl-pane" data-p="watch">
        <div class="vframe"><iframe id="cframe" title="Watch the film" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
        <a class="yt" id="cwatch" href="#" target="_blank" rel="noopener">Watch on YouTube</a>
      </div>
      <div class="sl-pane sl-story" data-p="story"><div id="cnote"></div></div>
      <div class="sl-pane" data-p="listen">
        <div class="cd-player">
          <div class="pl">
            <button class="pbtn" id="cplay" type="button" disabled aria-label="Play"><i class="pico" aria-hidden="true"></i></button>
            <input id="cseek" type="range" min="0" max="1000" value="0" aria-label="Seek" disabled>
            <span class="pl-time" id="ctime">0:00</span>
          </div>
          <ol class="tracks" id="ctracks"></ol>
        </div>
      </div>
    </div>
  </div>

<footer>
  <span>&copy; 2026 Ruben Camacho &middot; rbncreates.com</span>
  <a href="index.html">Home</a>
</footer>

<script src="site.js"></script>
<script src="catalogue.js"></script>
</body>
</html>
